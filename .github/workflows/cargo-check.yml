name: CI
on:
  push:
    branches: [ "iced-gui" ]

  pull_request:
    branches: [ "main", "iced-gui" ]

  workflow_call:

permissions:
  contents: read

jobs:
  pre-commit:
    uses: ./.github/workflows/pre-commit.yml
    with:
      pull_request: ${{ github.event_name == 'pull_request' }}

  build_and_test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs:
      - pre-commit
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Setup toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "danceinterpreter-CI"

      - name: Cargo check
        uses: ClementTsang/cargo-action@v0.0.7
        id: cargo-check
        with:
          command: check

      - name: Cargo test
        uses: ClementTsang/cargo-action@v0.0.7
        id: cargo-test
        with:
          command: test
